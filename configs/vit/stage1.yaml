# ViT stage 1: A learns CIFAR-10, C learns CIFAR-100. Same settings for both.

lr: 1.0e-3                # starting learning rate (AdamW). Starting value: check it on the baseline run
schedule: cosine          # after warmup, lr goes smoothly down to 0 over all epochs
warmup_epochs: 10         # ViTs need a warmup: the lr grows from ~0 to 1e-3 over the first 10 epochs

epochs: 1                 # placeholder: set the real number from the baseline run (A, seed 1).
                          # After that, never change it: A and C, and every seed, train equally long.

eval_every_epochs: 1      # test accuracy and loss after every epoch
resume_every_epochs: 10   # save a resume file this often, in case the run is interrupted
